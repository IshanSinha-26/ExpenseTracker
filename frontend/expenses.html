<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expenses - Expense Tracker</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet" href="css/expenses.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="expenses.html" class="active">
                Expenses
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="login.html">
                Logout
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="expense-container">

        <div class="page-header">

            <div>

                <h1>
                    Expenses
                </h1>

                <p>
                    Manage your expenses
                </p>

            </div>

            <button class="add-expense-btn" id="openAddExpense">

                + Add Expense

            </button>

        </div>


        <!-- Search and Filters -->

        <section class="filter-section">

            <div class="search-box">

                <label for="searchExpense">
                    Search
                </label>

                <input type="text" id="searchExpense" placeholder="Search expenses...">

            </div>


            <div class="filter-box">

                <label for="categoryFilter">
                    Category
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Eduation">
                        Education
                    </option>

                    <option value="Healthcare">
                        Healthcare
                    </option>
                    
                    <option value="Rent">
                        Rent
                    </option>

                    <option value="Other">
                        Other
                    </option>

                    <option value="Gym">
                        Gym
                    </option>

                </select>

            </div>


            <div class="filter-box">

                <label for="dateFilter">
                    Date
                </label>

                <input type="date" id="dateFilter">

            </div>

        </section>


        <!-- Expenses Table -->

        <section class="dashboard-card">

            <div class="section-header">

                <h2>
                    All Expenses
                </h2>

                <span id="expenseCount">
                    0 expenses
                </span>

            </div>


            <div class="expense-table" id="expenseTable">

                <!-- JavaScript will insert expenses here -->

            </div>

        </section>

    </main>


    <!-- Add/Edit Expense Modal -->

    <div class="modal" id="expenseModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Expense
                </h2>

                <button class="close-btn" id="closeModal">

                    ×

                </button>

            </div>


            <form id="expenseForm">

                <input type="hidden" id="expenseId">


                <div class="form-group">

                    <label for="expenseAmount">
                        Amount
                    </label>

                    <input type="number" id="expenseAmount" placeholder="Enter amount" min="0" step="0.01" required>

                </div>


                <div class="form-group">

                    <label for="expenseCategory">
                        Category
                    </label>

                    <select id="expenseCategory">
                    </select>

                </div>


                <div class="form-group">

                    <label for="expenseDescription">
                        Description
                    </label>

                    <input type="text" id="expenseDescription" placeholder="Enter description" required>

                </div>


                <div class="form-group">

                    <label for="expenseDate">
                        Date
                    </label>

                    <input type="date" id="expenseDate" required>

                </div>


                <button type="submit" class="save-expense-btn">

                    Save Expense

                </button>

            </form>

        </div>

    </div>


    <script src="js/expenses.js"></script>

</body>

</html>
